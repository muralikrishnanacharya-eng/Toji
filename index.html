<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="TOJI BODY - Progressive Overload Workout Tracker with AI-Powered Progression"/>
  
  <title>TOJI BODY</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23ff2244' width='180' height='180'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central' font-family='monospace'>T</text></svg>"/>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json"/>
  
  <!-- Apple Web App -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23ff2244' width='180' height='180' rx='40'/><text x='50%' y='50%' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central' font-family='monospace'>T</text></svg>"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="TOJI BODY"/>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  
  <!-- Styles (inline for single-file deployment) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Rajdhani', sans-serif;
      --font-display: 'Bebas Neue', cursive;
      --bg: #05050f;
      --bg2: #0b0b1a;
      --bg3: #111126;
      --bg4: #181830;
      --red: #ff2244;
      --red2: #ff4466;
      --green: #00e87a;
      --blue: #44aaff;
      --gold: #ffaa00;
      --text: #f0f0ff;
      --text2: #9090b8;
      --text3: #44445a;
      --border: #1c1c34;
      --shadow-card: 0 4px 24px rgba(0,0,0,0.5);
    }

    [data-theme="light"] {
      --bg: #f5f6fa;
      --bg2: #ffffff;
      --bg3: #eef0f8;
      --bg4: #e4e6f2;
      --red: #d4002a;
      --text: #0a0a1e;
      --text2: #3a3a5c;
      --text3: #7878a0;
      --border: #d0d3e8;
      --shadow-card: 0 2px 16px rgba(0,0,40,0.08);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    input, button, select, textarea {
      font-family: var(--font-body);
      border: none;
      outline: none;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--red);
      text-decoration: none;
    }

    #app {
      min-height: 100vh;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    #main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash-ring {
      width: 100px;
      height: 100px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-title {
      font-family: var(--font-display);
      font-size: 48px;
      letter-spacing: 6px;
      color: var(--text);
    }

    .splash-title span {
      color: var(--red);
      text-shadow: 0 0 20px var(--red);
    }

    .splash-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 3px;
      margin-top: 8px;
    }

    /* Auth UI */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .auth-header h1 {
      font-family: var(--font-display);
      font-size: 48px;
      letter-spacing: 4px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .auth-header h1 span {
      color: var(--red);
    }

    .auth-header p {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 3px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .auth-input {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 14px;
    }

    .auth-input::placeholder {
      color: var(--text3);
    }

    .auth-button {
      background: var(--red);
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      transition: all 0.2s ease;
    }

    .auth-button:hover {
      background: var(--red2);
      transform: translateY(-2px);
    }

    .auth-button:active {
      transform: translateY(0);
    }

    .auth-toggle {
      text-align: center;
      font-size: 13px;
      color: var(--text2);
    }

    .auth-toggle a {
      color: var(--red);
      cursor: pointer;
      font-weight: 600;
    }

    .auth-error {
      background: #ff224422;
      border: 1px solid #ff224466;
      color: #ff6688;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    /* Header */
    #header {
      background: linear-gradient(180deg, #07070f, #0a0a18);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-card);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .logo-title {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 4px;
      line-height: 1;
    }

    .logo-title span {
      color: var(--red);
    }

    .logo-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 3px;
      margin-top: 2px;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      border: 1px solid;
      font-weight: 600;
    }

    /* Bottom Nav */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(5, 5, 14, 0.97);
      border-top: 1px solid var(--border);
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 2px;
      border-radius: 10px;
      background: none;
      border: none;
      color: var(--text3);
      font-family: var(--font-mono);
      font-size: 10px;
      transition: all 0.18s ease;
      min-height: 52px;
      justify-content: center;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--red);
      background: #ff224422;
    }

    .nav-icon {
      font-size: 20px;
      line-height: 1;
    }

    /* Card Styling */
    .card {
      background: linear-gradient(150deg, #0d0d1e, #111128);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--red2), transparent);
      opacity: 0.4;
    }

    .section {
      padding: 14px;
    }

    /* Loading State */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* Utility Classes */
    .hidden {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 480px) {
      .logo-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-ring"></div>
  <div class="splash-title">TOJI <span>BODY</span></div>
  <div class="splash-sub">PROGRESSIVE WORKOUT TRACKER</div>
</div>

<!-- Auth Screen -->
<div id="auth-screen" class="hidden">
  <div class="auth-container">
    <div class="auth-header">
      <h1>TOJI <span>BODY</span></h1>
      <p>PROGRESSIVE OVERLOAD SYSTEM</p>
    </div>

    <div id="auth-error" class="auth-error hidden"></div>

    <div id="login-form">
      <div class="auth-form">
        <input id="email-input" type="email" class="auth-input" placeholder="Email address" autocomplete="email"/>
        <input id="password-input" type="password" class="auth-input" placeholder="Password" autocomplete="current-password"/>
        <button class="auth-button" onclick="handleLogin()">SIGN IN</button>
      </div>
      <div class="auth-toggle">
        No account? <a onclick="toggleAuthMode()">Create one</a>
      </div>
    </div>

    <div id="signup-form" class="hidden">
      <div class="auth-form">
        <input id="signup-email-input" type="email" class="auth-input" placeholder="Email address" autocomplete="email"/>
        <input id="signup-password-input" type="password" class="auth-input" placeholder="Password (min 6 characters)" autocomplete="new-password"/>
        <input id="signup-password-confirm" type="password" class="auth-input" placeholder="Confirm password" autocomplete="new-password"/>
        <button class="auth-button" onclick="handleSignup()">CREATE ACCOUNT</button>
      </div>
      <div class="auth-toggle">
        Already have an account? <a onclick="toggleAuthMode()">Sign in</a>
      </div>
    </div>

    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center;">
      <p style="font-size: 11px; color: var(--text3); margin-bottom: 12px;">Or sign in anonymously to try the app</p>
      <button class="auth-button" style="background: var(--blue);" onclick="handleAnonymousAuth()">ANONYMOUS</button>
    </div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div id="header"></div>
  <div id="main-content"></div>
  <div id="bottom-nav">
    <div class="nav-row">
      <button class="nav-btn active" onclick="setView('today')">
        <div class="nav-icon">💪</div>
        <div>TODAY</div>
      </button>
      <button class="nav-btn" onclick="setView('week')">
        <div class="nav-icon">📊</div>
        <div>WEEK</div>
      </button>
      <button class="nav-btn" onclick="setView('progress')">
        <div class="nav-icon">📈</div>
        <div>PROGRESS</div>
      </button>
      <button class="nav-btn" onclick="setView('nutrition')">
        <div class="nav-icon">🍗</div>
        <div>NUTRITION</div>
      </button>
      <button class="nav-btn" onclick="setView('settings')">
        <div class="nav-icon">⚙️</div>
        <div>SETTINGS</div>
      </button>
    </div>
  </div>
</div>

<!-- Firebase & Scripts -->
<script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
<script defer src="firebase-config.js"></script>
<script defer src="app.js"></script>

<script>
  // Register service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker registration failed:', err));
    });
  }
</script>

</body>
</html>
